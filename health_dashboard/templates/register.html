<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - HealthPulse Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f8fafc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 520px;
            padding: 2.25rem;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Logo" width="48" height="48" class="mb-2">
            <h3 class="fw-bold text-dark mb-1">Join HealthPulse</h3>
            <p class="text-muted small">Register to track and analyze personal wearable health records</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show small py-2" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Username *</label>
                    <input type="text" name="username" class="form-control form-control-sm" placeholder="e.g. jdoe" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Full Name *</label>
                    <input type="text" name="full_name" class="form-control form-control-sm" placeholder="e.g. John Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Email Address *</label>
                <input type="email" name="email" class="form-control form-control-sm" placeholder="john@example.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Password *</label>
                <input type="password" name="password" class="form-control form-control-sm" placeholder="At least 6 characters" minlength="6" required>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6 col-md-3">
                    <label class="form-label small fw-semibold text-secondary">Age</label>
                    <input type="number" name="age" class="form-control form-control-sm" value="23" min="10" max="110">
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label small fw-semibold text-secondary">Gender</label>
                    <select name="gender" class="form-select form-select-sm">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other" selected>Other</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label small fw-semibold text-secondary">Weight (kg)</label>
                    <input type="number" step="0.5" name="weight_kg" class="form-control form-control-sm" value="68.0">
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label small fw-semibold text-secondary">Height (cm)</label>
                    <input type="number" step="0.5" name="height_cm" class="form-control form-control-sm" value="175.0">
                </div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary-custom py-2">
                    <i class="bi bi-person-check-fill me-1"></i> Complete Registration
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted small">Already have an account? </span>
            <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-primary text-decoration-none">Sign In</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
